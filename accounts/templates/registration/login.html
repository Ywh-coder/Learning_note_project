{% extends "learning_notes/base.html" %}
{% load django_bootstrap5 %}
{% block page_header %}
<h2> Log in to your accounts.</h2>
{% endblock page_header %}
{% block content %}
<form action="{% url 'accounts:login' %}" method="POST">
    {% csrf_token %}
    {% bootstrap_form form %}
    {% bootstrap_button button_type="submit"  content="Log in" %}
</form>
{% endblock content %}
